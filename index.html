<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
   <meta name="theme-color" content="#40E0D0">
   <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌏</text></svg>"> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرحباً بك في Alqurmanix</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            font-family: 'Cairo', sans-serif;
            color: white;
            text-align: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px border rgba(255, 255, 255, 0.2);
            max-width: 90%;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        p {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        .highlight {
            color: #00d4ff;
            font-weight: bold;
        }
        .footer {
            margin-top: 20px;
            font-size: 0.9rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>مرحباً بك في <span class="highlight">Alqurmanix</span></h1>
        <p> قيد الإنشاء والتحضير.</p>
        <div class="footer">
            &copy; 2026 جميع الحقوق محفوظة
        </div>
    </div>
<script>
    (function() {
        const synth = window.speechSynthesis;
        let isSpeaking = false;

        // وظيفة النطق الأساسية
        function speak(text) {
            if (synth.speaking) synth.cancel(); // إلغاء أي صوت حالي لبدء الصوت الجديد فوراً

            const utterance = new SpeechSynthesisUtterance(text);
            const voices = synth.getVoices();
            // محاولة جلب صوت أنثوي عربي
            const femaleVoice = voices.find(v => v.lang.includes('ar') && (v.name.includes('female') || v.name.includes('Google') || v.name.includes('Hoda')));
            
            if (femaleVoice) utterance.voice = femaleVoice;
            utterance.lang = 'ar-SA';
            utterance.rate = 1.0; 
            utterance.pitch = 1.2;

            synth.speak(utterance);
        }

        // 1. الترحيب عند أول تفاعل
        const startWelcome = () => {
            const pageName = document.title.split('|')[0].trim();
            speak(`أهلاً بك في ${pageName}. أنا مساعدتك الذكية، سأكون معك خلال تصفحك.`);
            window.removeEventListener('mousedown', startWelcome);
            window.removeEventListener('touchstart', startWelcome);
        };
        window.addEventListener('mousedown', startWelcome);
        window.addEventListener('touchstart', startWelcome);

        // 2. التفاعل مع العناصر (القوائم، الروابط، الأزرار)
        document.addEventListener('click', (e) => {
            const target = e.target;

            // إذا ضغط على رابط
            if (target.tagName === 'A') {
                speak(`جاري الانتقال إلى ${target.innerText}`);
            }
            // إذا ضغط على زر أو قائمة
            else if (target.tagName === 'BUTTON' || target.getAttribute('role') === 'button') {
                speak(`تم الضغط على ${target.innerText || 'الزر'}`);
            }
            // إذا ضغط على حقل إدخال (Input)
            else if (target.tagName === 'INPUT') {
                const label = document.querySelector(`label[for="${target.id}"]`)?.innerText || target.placeholder;
                speak(`يرجى الكتابة في حقل ${label || 'الإدخال'}`);
            }
        });

        // 3. التفاعل عند الوقوف بالماوس (اختياري - يعطي تنبيه قبل الضغط)
        document.querySelectorAll('nav a, button').forEach(elem => {
            elem.addEventListener('mouseenter', () => {
                if (!synth.speaking) {
                    speak(`أنت تقف الآن على ${elem.innerText}`);
                }
            });
        });

    })();
</script>
</body>
</html>

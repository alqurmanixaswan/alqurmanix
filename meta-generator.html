<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>مولد Meta Tags - AQX</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Tahoma,sans-serif;
    }

    body{
      background:#0f172a;
      color:#fff;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .box{
      width:100%;
      max-width:800px;
      background:#111827;
      border:1px solid #1e293b;
      border-radius:18px;
      padding:25px;
      box-shadow:0 0 25px rgba(0,0,0,.4);
    }

    h1{
      text-align:center;
      margin-bottom:25px;
      color:#38bdf8;
      font-size:32px;
    }

    .input-box{
      margin-bottom:18px;
    }

    label{
      display:block;
      margin-bottom:8px;
      color:#cbd5e1;
      font-size:15px;
    }

    input, textarea{
      width:100%;
      padding:14px;
      border:none;
      outline:none;
      border-radius:12px;
      background:#1e293b;
      color:#fff;
      font-size:15px;
    }

    textarea{
      resize:vertical;
      min-height:100px;
    }

    button{
      width:100%;
      padding:15px;
      border:none;
      border-radius:14px;
      background:#0ea5e9;
      color:#fff;
      font-size:18px;
      cursor:pointer;
      transition:.3s;
      font-weight:bold;
      margin-top:10px;
    }

    button:hover{
      background:#0284c7;
    }

    .result{
      margin-top:25px;
    }

    pre{
      background:#020617;
      padding:20px;
      border-radius:14px;
      overflow:auto;
      color:#38bdf8;
      direction:ltr;
      text-align:left;
      white-space:pre-wrap;
      word-wrap:break-word;
      border:1px solid #1e293b;
    }

    .copy-btn{
      margin-top:15px;
      background:#22c55e;
    }

    .copy-btn:hover{
      background:#16a34a;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>مولد Meta Tags</h1>

    <div class="input-box">
      <label>عنوان الموقع</label>
      <input type="text" id="title" placeholder="مثال: القرماني X">
    </div>

    <div class="input-box">
      <label>وصف الموقع</label>
      <textarea id="description" placeholder="اكتب وصف الموقع هنا"></textarea>
    </div>

    <div class="input-box">
      <label>الكلمات المفتاحية</label>
      <input type="text" id="keywords" placeholder="مثال: القرماني, AQX, alqurmani x">
    </div>

    <button onclick="generateMeta()">
      توليد Meta Tags
    </button>

    <div class="result">
      <pre id="output"></pre>

      <button class="copy-btn" onclick="copyCode()">
        نسخ الكود
      </button>
    </div>

  </div>

<script>

function generateMeta(){

  let title = document.getElementById("title").value;
  let description = document.getElementById("description").value;
  let keywords = document.getElementById("keywords").value;

  let code = `<!-- Primary Meta Tags -->
<title>${title}</title>

<meta name="title" content="${title}">
<meta name="description" content="${description}">
<meta name="keywords" content="${keywords}">
<meta name="robots" content="index, follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="website">
<meta property="og:title" content="${title}">
<meta property="og:description" content="${description}">

<!-- Twitter -->
<meta property="twitter:card" content="summary_large_image">
<meta property="twitter:title" content="${title}">
<meta property="twitter:description" content="${description}">`;

  document.getElementById("output").textContent = code;
}

function copyCode(){

  let text = document.getElementById("output").textContent;

  navigator.clipboard.writeText(text);

  alert("تم نسخ الكود بنجاح");
}

</script>

</body>
</html>
